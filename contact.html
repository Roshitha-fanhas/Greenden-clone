<body>
  <!--Responsive Navbar-->
  <nav class="bg-green-100 p-6 flex items-center justify-between shadow-xl sticky top-0 z-10">
  <h1 class="text-2xl ml-8">GREENDEN🍃</h1>
    <ul class="flex gap-5 text-grey-600 hidden md:flex">
      <li>
        <a class="hover:underline hover:text-black mr-8" href="#">Home</a>
      </li>
      <li>
        <a class="hover:underline hover:text-black mr-8" href="#">Product</a>
      </li>
      <li>
        <a class="hover:underline hover:text-black mr-8" href="#">Contact</a>
      </li>
    </ul>
  </nav>
  <div class="p-10 mx-auto max-w-xl bg-white">
        <h1 class="text-3xl text-slate-900 font-bold p-5 text-center">Contact us..!</h1>
        <form class="mt-8 space-y-5">
          <div>
            <label class='text-sm text-slate-900 font-medium mb-2 block'>Name</label>
            <input type='text' placeholder='Enter Your Name'
              class="w-full py-2.5 px-4 text-slate-800 bg-gray-100 border border-gray-200 focus:border-slate-900 focus:bg-transparent text-sm outline-0 transition-all" />
          </div>
          <div>
            <label class='text-sm text-slate-900 font-medium mb-2 block'>Email</label>
            <input type='email' placeholder='Enter Your Email'
              class="w-full py-2.5 px-4 text-slate-800 bg-gray-100 border border-gray-200 focus:border-slate-900 focus:bg-transparent text-sm outline-0 transition-all" />
          </div>
          <div>
            <label class='text-sm text-slate-900 font-medium mb-2 block'>Phone</label>
            <input type='text' placeholder='Enter Your Own Number'
              class="w-full py-2.5 px-4 text-slate-800 bg-gray-100 border border-gray-200 focus:border-slate-900 focus:bg-transparent text-sm outline-0 transition-all" />
          </div>
          <div>
            <label class='text-sm text-slate-900 font-medium mb-2 block'>Message</label>
            <textarea placeholder='Leave a Comment...' rows="6"
              class="w-full px-4 text-slate-800 bg-gray-100 border border-gray-200 focus:border-slate-900 focus:bg-transparent text-sm pt-3 outline-0 transition-all"></textarea>
          </div>
          <button type='button'
            class="text-white bg-slate-900 font-medium hover:bg-slate-800 tracking-wide text-sm px-4 py-2.5 w-full border-0 outline-0 cursor-pointer">Send message</button>
        </form>
      </div>
  <!--Footer-->
    <section class="bg-green-100 p-10 flex flex-col gap-5 mt-5">
